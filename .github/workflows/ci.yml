name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.8-alpine
        env:
          POSTGRES_USER: hushmap
          POSTGRES_PASSWORD: hushmap
          POSTGRES_DB: hushmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hushmap -d hushmap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://hushmap:hushmap@127.0.0.1:5432/hushmap
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run alembic upgrade head
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - name: Build for Vercel
        run: pnpm build
        env:
          VERCEL: 1

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
