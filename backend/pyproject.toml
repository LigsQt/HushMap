[project]
name = "hushmap-backend"
version = "0.1.0"
description = "HushMap FastAPI backend"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115,<1",
    "google-genai>=1.0",
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "scipy>=1.15,<2",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/services/process_audio.py" = ["E701", "E501", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
